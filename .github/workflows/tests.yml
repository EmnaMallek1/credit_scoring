name: tests

on: [push, pull_request] #run on every push

jobs:
  test:
    runs-on: ubuntu-latest #use a Linux machine provided by GitHub
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-agent.txt pytest

      - name: Run tests
        run: pytest -q
        env:
          MODEL_DIR: model_bundle

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build Docker image
        run: docker build -t credit-scoring-api .